  - "The live-run proof's TLS connection accepts an invalid, self-signed, expired, or wrong-hostname certificate, or the real API key is sent to any origin other than an authenticated api.anthropic.com — a real security regression for a security-focused masking proxy's first live network egress. (Codex cross-model finding: the original criteria had no genuine behavioral falsifier for TLS authentication at all.)"
  - "A streaming response (`stream: true`) reaches the wrapped client with placeholders unresolved because demask_response.rs's unchanged-body behavior for non-JSON/SSE bodies silently passed it through — i.e. the non-streaming confirmation criterion above was assumed rather than actually enforced or verified."
  - "The real API key, or the synthetic sensitive value planted for the masking proof, appears unmasked in any log, process argument, error message, or committed evidence artifact this mission produces."
