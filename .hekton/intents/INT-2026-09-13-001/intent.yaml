hypothesis: >
  We believe that building a real TLS client for veilgremlin's vg-proxy upstream
  forwarder (crates/vg-proxy/src/upstream.rs, confirmed genuinely plain-HTTP-only —
  TcpStream + hyper::client::conn::http1, no TLS anywhere, no host/TLS/API-key config
  surface), adding Anthropic API-key mode on top of the header-forwarding surface that
  already exists, and proving both with one real, live, non-streaming Claude Code
  session routed through vg-proxy to the real https://api.anthropic.com — not a mock —
  closes M5 (veilgremlin's own "next up" milestone per docs/next-actions.md) and the
  largest concretely-scoped remaining piece of Track 1's contribution to beta condition
  1 (masking data plane works for real traffic), while leaving M6 (streaming), A3
  (daemon bootstrap), and real document-content-block sub-case handling (text/base64/
  url) untouched as later Track 1 items this mission does not start, and while keeping
  the already-shipped, already-tested document/image fail-closed content-block blocking
  provably unregressed by this mission's own transport-layer changes.
confirmation_criteria:
  - "A live-run proof (this repo's own veil-demo *-proof.sh precedent, or an equivalent real invocation recorded in this mission's own evidence) routes one real, non-streaming Claude Code session through vg-proxy, over a real TLS connection to https://api.anthropic.com, using a real Anthropic API key — AND the proof plants a synthetic sensitive value (e.g. a fake email/phone/secret) in the prompt that is masked before egress and correctly demasked in the real response reaching the wrapped client. A benign request/response round-trip that never exercises masking does NOT satisfy this criterion — the hypothesis is about the masking data plane working over real TLS, not merely that an HTTP client can reach api.anthropic.com. (Codex cross-model finding: the original wording allowed a 'non-error response' from a direct API-key call to satisfy this without ever proving a masked/demasked round-trip.)"
  - "The live-run proof demonstrates vg-proxy actually listening and routing real traffic — reusing or extending the existing crates/vg-proxy/tests/server_smoke.rs-style pattern (a real bound listener, not a mock upstream) — WITHOUT building A3's own production state-dir/keychain discovery for a vg-proxy daemon *binary*. This mission may build the minimal dev/test harness needed to start vg-proxy as a live listener for the proof; the A3-scope-creep disproof criterion below is about production daemon bootstrap specifically, not this minimal harness. (Codex cross-model finding: confirmed against crates/vg-cli/src/main.rs and crates/vg-proxy/src/session.rs that no production `vg` subcommand starts vg-proxy today and unregistered addresses fail closed with UnregisteredAddr — this criterion resolves the resulting A2/A3 boundary ambiguity explicitly rather than leaving it for the mission to guess.)"
  - "Anthropic API-key mode works for real: a real API key sourced from the environment reaches the real https://api.anthropic.com over an AUTHENTICATED TLS connection — standard WebPKI certificate chain validation and hostname matching against api.anthropic.com, no disabled/bypassed certificate verification — via the x-api-key header (already allow-listed in FORWARDED_HEADERS today), and a real, non-error response returns through vg-proxy to the wrapped client. (Codex cross-model finding: 'real TLS' as originally worded did not require certificate validation at all — an implementation that disabled cert verification would have satisfied the original criterion.)"
  - "The live-run proof's request is confirmed non-streaming: either the proof explicitly sets/confirms `stream: false`, or the implementation forces non-streaming for this mission's scope and fails closed (not silently passes through unmodified) on a `stream: true` request. (Codex cross-model finding, confirmed against docs/decisions.md's 2026-08-24 M3 entry, 'Streaming (M6) — non-streaming only; `stream: true` is neither detected nor specially handled,' and demask_response.rs's unchanged-body behavior for non-JSON bodies: nothing in the original wording prevented a streaming response from silently reaching the client with placeholders unresolved.)"
  - "A regression test at the integration level — through vg-proxy's actual request-routing path, not only mask_request.rs's own unit tests — demonstrates the existing document/image content-block fail-closed blocking (ContentBlockKind::Document/Image → MaskRequestError::BlockedContentBlock) is unchanged by this mission's TLS/upstream/routing work and that neither block type reaches the real upstream. This mission confirms an already-shipped conservative default stays true end-to-end, per this intent's own GROUND correction to the plan's A2 row wording; it does not design new document-handling logic (real text/base64/url sub-case handling stays explicitly out of scope). (Codex cross-model finding: the original criterion permitted merely rerunning the existing unit test, which would stay green even if a TLS/routing refactor bypassed mask_request.rs entirely.)"
  - "cargo build --workspace --locked, cargo clippy --workspace --all-targets --locked -- -D warnings, cargo fmt --check, cargo test --workspace --locked, cargo deny check, and cargo audit all pass clean after this mission's changes — matching this repo's actual CI gates (.github/workflows/ci.yml) for a security-sensitive new dependency, not only the narrower subset prior milestones' own next-actions.md entries happened to name. (Codex cross-model finding: the original criterion omitted --locked/cargo-deny/cargo-audit despite CI running all three.)"
  - "The new TLS crate dependency this mission adds (not pre-selected by this intent — e.g. whether XREPO-015's rustls precedent for the telemetry-emitter TLS surface also fits a hyper-based upstream client, or a different crate fits better) is presented to the user as an explicit choice, with a real opportunity to object, BEFORE it lands — via AskUserQuestion or equivalent — not merely recorded after the fact in docs/decisions.md or a new ADR. (Codex cross-model finding: governance.yaml's dependency_changes: human_required means a human approves the choice; a written record after the fact documents a decision, it does not constitute the approval the policy requires.)"
  - "This mission's live-run proof, and any evidence artifact it produces, never contains the raw API key or the synthetic sensitive value's raw (unmasked) form in logs, process arguments, error messages, or committed transcripts — matching this repo's own never_commit_secrets agent default (governance.yaml) and RISK-0004/F4's own vault-key-handling concern, extended here to the API key this mission is the first to exercise for real. (Codex cross-model finding: the artifact as originally written under-counted governance triggers — this mission also touches credential_or_secret_changes, real API-key handling for the first time, not only dependency_changes.)"
  - "docs/next-actions.md's M5 entry, docs/session-log.md, and (per veilgremlin's own AGENTS.md convention) a docs/build-log/ entry are all updated to reflect this mission's real end state — built, partially built with named remaining gaps, or blocked — not left stale. (Codex cross-model finding: the original criterion named next-actions.md only, omitting this repo's own other required traceability artefacts.)"
  - "veil-ecosystem's own docs/beta-implementation-plan.md Progress tracker (Track 1 row, currently 'Not started') is updated to reflect A2's real status once this mission closes."
