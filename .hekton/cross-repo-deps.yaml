cross_repo_deps_version: 1
# Stable-ID registry of live cross-repo dependencies -- the same pattern
# risk-register.yaml already uses for risks (stable IDs + a parity check
# against a human-readable Markdown explanation), applied here so a
# dependency can be referenced from any repo's own next-actions.md by ID
# rather than restated independently, which drifts (see docs/decisions.md,
# 2026-09-04, "Retired the out-of-band audit artifact" and the follow-on
# entry for this registry).
#
# This is an INDEX, not a second narrative: the one-line `title` plus
# `detail` here should be the shared, canonical statement of what the
# dependency IS; docs/architecture.md's "Sequencing to close them" section
# still owns the fuller WHY and current priority ordering. Each repo's own
# next-actions.md may still add repo-local execution detail (e.g. "run
# terraform plan here") alongside a reference to the ID -- what it should
# NOT do is restate the cross-repo dependency's own description
# independently, which is the exact drift this registry exists to stop.
#
# eco_checker.py's check_cross_repo_dep_ids validates that every XREPO-ID
# referenced anywhere in any of the six repos' next-actions.md actually
# exists here (a dangling reference), and flags (as a warning, not yet an
# error, until backfilling is complete) any entry here not yet referenced
# from at least one of the repos it names.
deps:
  - id: XREPO-001
    title: "veil-observatory has not called any of veil-custodian's three Role::Observatory-gated endpoints (attestation/status, certificates/crl, signing-keys/{key_ref})"
    repos: [veil-observatory, veil-custodian]
    status: closed
    raised_date: 2026-08-22
    reviewed_date: 2026-09-06
    closed_date: 2026-09-06
    detail: >
      Closed on one real, live-proven call, per docs/architecture.md's sequencing step 4
      ("have veil-observatory call one of them for real"). veil-observatory's
      GET /v1/signing-keys/{key_ref} caller (custodian.py's CustodianClient,
      verify-signing-keys CLI command, ADR-0018) shipped in PR #17 -- independently reviewed
      (4 real bugs found and fixed: an HTTP status-code miscategorization, an unhandled
      OSError crash path, a malformed-finding edge case on revoked-with-no-revoked_at, and
      duplicated algorithm-classification logic) before merging. Then live-proven, not just
      unit-tested: veil-demo's ecdsa-signing-proof.sh gained Steps 8-10, which sight a real
      signing key via a real edge event, check it against a real running veil-custodian,
      revoke the device through a real (stub-authn) call to
      POST /devices/{pseudonym}/revoke, and re-check -- confirming live that only a
      structurally-accepted (never cryptographically verified) sighting can mint a
      revoked-key CRITICAL finding, and that an HMAC-configured deployment's
      unverifiable_algorithm-only sighting correctly mints nothing. attestation/status and
      certificates/crl remain uncalled -- split out as XREPO-006, since they have no
      consumer anywhere (design-from-scratch, not a fixture swap), and this step only ever
      asked for one real call.
    links:
      - "docs/architecture.md#integration-status"
      - "veil-observatory PR #17 (dermdunc/veil-observatory)"
      - "veil-demo/docs/ecdsa-signing-proof-transcript.txt"

  - id: XREPO-002
    title: "No sandbox AWS account exists yet to validate veil-foundations' Terraform against, or for veil-observatory to ingest real evidence from"
    repos: [veil-foundations, veil-observatory]
    status: open
    raised_date: 2026-08-22
    reviewed_date: 2026-09-04
    detail: >
      veil-foundations' one real module is validated only against a mock provider; every
      finding veil-observatory has ever produced is against synthetic fixtures. Standing up
      one real sandbox account and running Phase 5 of veil-foundations' implementation plan
      (first real `terraform plan`/`apply`) unblocks both. See docs/architecture.md's
      "Sequencing to close them" step 5.
    links:
      - "docs/architecture.md#sequencing-to-close-them"

  - id: XREPO-003
    title: "veil-custodian has no signing-key renewal endpoint; veil-enrol has no renew-signing-key subcommand to call it"
    repos: [veil-custodian, veil-enrol]
    status: open
    raised_date: 2026-08-31
    reviewed_date: 2026-09-04
    detail: >
      Both repos independently name the other half of this same gap in their own
      next-actions.md, without linking to each other -- the exact drift this registry exists
      to catch. veil-enrol's issue-signing-key command has no corresponding renewal path
      because veil-custodian has never built one; ADR-VE-004 in veil-enrol deliberately
      declines to guess the shape until it exists.
    links: []

  - id: XREPO-004
    title: "veilgremlin's raw r||s (not DER) ECDSA signature-encoding decision needs sign-off from veil-custodian and veil-observatory before any real cross-repo signing happens"
    repos: [veilgremlin, veil-custodian, veil-observatory]
    status: closed
    raised_date: 2026-08-31
    reviewed_date: 2026-09-05
    closed_date: 2026-09-05
    detail: >
      ADR-S names the signing algorithm but takes no position on signature encoding.
      veilgremlin's 2026-08-31 acceptance session decided fixed-width raw r||s (64 bytes) over
      DER, because DER admits multiple valid encodings of one signature and a byte-exact
      golden vector needs exactly one -- but asks for sign-off before treating that as final.
      veil-custodian's own next-actions.md records the ask explicitly, disclosing that "the
      sign-off itself is not this session's to give." veil-observatory's next-actions.md did
      not mention this ask at all as of 2026-09-04 -- confirmed by direct search, not assumed
      absent -- meaning this was, until closed, a one-sided request neither addressee had
      actually seen reflected in their own backlog. Evidence added 2026-09-05: veil-demo's
      ECDSA signing proof (`scripts/ecdsa-signing-proof.sh`) confirmed the raw r||s encoding
      is cryptographically sound and independently verifiable (a from-scratch DER-wrapping
      verifier, including a tampered-signature negative control, confirmed real signatures
      verify and corrupted ones don't), and confirmed live against a real veil-observatory
      instance exactly what happens absent sign-off: an ECDSA-signed record is explicitly and
      safely refused (401), naming this exact gap in its own rejection message. **Closed
      2026-09-05: human sign-off given**, on the strength of that evidence -- raw r||s is
      accepted as veilgremlin's ECDSA wire encoding for cross-repo signing. Downstream work
      this unblocks (veil-observatory building real ECDSA verification, e.g. via KMS Verify
      or a native P-256 library, to replace today's explicit-refusal posture) is not itself
      scheduled by this closure -- that remains separate, unbuilt work, now merely no longer
      blocked on an undecided encoding question.
    links:
      - "veil-demo/docs/ecdsa-signing-proof-transcript.txt"
      - "veil-demo/static/trust-chain.html#the-signing-key-actually-used"

  - id: XREPO-005
    title: "Should ADR-0014's correlation/determinism suite join the same cross-repo CI veto ADR-0012's raw-content fuzz test already has on a veil-proxy schema-generator PR?"
    repos: [veil-observatory, veilgremlin]
    status: closed
    raised_date: 2026-08-23
    reviewed_date: 2026-09-06
    closed_date: 2026-09-06
    detail: >
      Closed 2026-09-06 as mostly an unsynchronized ledger, not a live open question: veilgremlin
      had already reached this conclusion on 2026-08-23 (xhigh-effort Codex critique) and struck
      its own item through, saying explicitly "deferred, not ratified" -- the reasoning was
      settled, human ratification was not, and veil-observatory's own backlog never recorded the
      answer. Ratified on both sides now: NOT `tests/pipeline/test_pipeline.py`'s full suite
      (only 4 of its 14 tests are even ADR-0014-relevant); instead a new, narrow, independently-
      runnable module, veil-observatory's `tests/correlation/test_correlation_contract_gate.py`
      (ADR-0019), asserting against the PRODUCTION `Correlator` -- not `query_time.py`'s
      prototype, which ADR-0016 explicitly bars from production status, a distinction the
      original Codex recommendation's wording did not make. Covers 8 facts, not 7: building
      against the real correlator surfaced `_identity_mismatch()`, a more security-critical
      account/region-mismatch case (a receipt's own signed identity vs. the invocation) than the
      CloudTrail-record case the recommendation named, added rather than traded for it. 10 new
      tests, full suite 610 passed / 2 skipped, 0 regressions.
    links:
      - "veil-observatory/docs/decisions/ADR-0019-correlation-contract-gate.md"
      - "veilgremlin/docs/decisions.md#2026-09-06"

  - id: XREPO-006
    title: "veil-observatory has no consumer for veil-custodian's GET /v1/attestation/status or GET /v1/certificates/crl"
    repos: [veil-observatory, veil-custodian]
    status: open
    raised_date: 2026-09-06
    reviewed_date: 2026-09-06
    detail: >
      Split out of XREPO-001 on its closure (2026-09-06), rather than left implied by
      silence. Unlike the signing-key-status endpoint, these two have no consumer anywhere
      in veil-observatory today -- no stub, no fixture, no FindingEngine/Correlator seam
      that wants CRL or attestation data. This is real design-from-scratch work, not a
      fixture swap. The real constraint found while building XREPO-001's caller:
      tests/fitness/test_architecture.py's ADR-0011 network-I/O exemption means any new
      custodian caller must live in custodian.py and be reachable only from cli.py -- a CRL
      cache consulted inline by the pipeline is architecturally excluded by the same fitness
      tests that bound custodian.py today.
    links:
      - "docs/architecture.md#integration-status"
