cross_repo_deps_version: 1
# Stable-ID registry of live cross-repo dependencies -- the same pattern
# risk-register.yaml already uses for risks (stable IDs + a parity check
# against a human-readable Markdown explanation), applied here so a
# dependency can be referenced from any repo's own next-actions.md by ID
# rather than restated independently, which drifts (see docs/decisions.md,
# 2026-09-04, "Retired the out-of-band audit artifact" and the follow-on
# entry for this registry).
#
# This is an INDEX, not a second narrative: the one-line `title` plus
# `detail` here should be the shared, canonical statement of what the
# dependency IS; docs/architecture.md's "Sequencing to close them" section
# still owns the fuller WHY and current priority ordering. Each repo's own
# next-actions.md may still add repo-local execution detail (e.g. "run
# terraform plan here") alongside a reference to the ID -- what it should
# NOT do is restate the cross-repo dependency's own description
# independently, which is the exact drift this registry exists to stop.
#
# eco_checker.py's check_cross_repo_dep_ids validates that every XREPO-ID
# referenced anywhere in any of the six repos' next-actions.md actually
# exists here (a dangling reference), and flags (as a warning, not yet an
# error, until backfilling is complete) any entry here not yet referenced
# from at least one of the repos it names.
deps:
  - id: XREPO-001
    title: "veil-observatory has not called any of veil-custodian's three Role::Observatory-gated endpoints (attestation/status, certificates/crl, signing-keys/{key_ref})"
    repos: [veil-observatory, veil-custodian]
    status: closed
    raised_date: 2026-08-22
    reviewed_date: 2026-09-06
    closed_date: 2026-09-06
    detail: >
      Closed on one real, live-proven call, per docs/architecture.md's sequencing step 4
      ("have veil-observatory call one of them for real"). veil-observatory's
      GET /v1/signing-keys/{key_ref} caller (custodian.py's CustodianClient,
      verify-signing-keys CLI command, ADR-0018) shipped in PR #17 -- independently reviewed
      (4 real bugs found and fixed: an HTTP status-code miscategorization, an unhandled
      OSError crash path, a malformed-finding edge case on revoked-with-no-revoked_at, and
      duplicated algorithm-classification logic) before merging. Then live-proven, not just
      unit-tested: veil-demo's ecdsa-signing-proof.sh gained Steps 8-10, which sight a real
      signing key via a real edge event, check it against a real running veil-custodian,
      revoke the device through a real (stub-authn) call to
      POST /devices/{pseudonym}/revoke, and re-check -- confirming live that only a
      structurally-accepted (never cryptographically verified) sighting can mint a
      revoked-key CRITICAL finding, and that an HMAC-configured deployment's
      unverifiable_algorithm-only sighting correctly mints nothing. attestation/status and
      certificates/crl remain uncalled -- split out as XREPO-006, since they have no
      consumer anywhere (design-from-scratch, not a fixture swap), and this step only ever
      asked for one real call.
    links:
      - "docs/architecture.md#integration-status"
      - "veil-observatory PR #17 (dermdunc/veil-observatory)"
      - "veil-demo/docs/ecdsa-signing-proof-transcript.txt"

  - id: XREPO-002
    title: "No sandbox AWS account exists yet to validate veil-foundations' Terraform against, or for veil-observatory to ingest real evidence from"
    repos: [veil-foundations, veil-observatory]
    status: open
    raised_date: 2026-08-22
    reviewed_date: 2026-09-04
    detail: >
      veil-foundations' one real module is validated only against a mock provider; every
      finding veil-observatory has ever produced is against synthetic fixtures. Standing up
      one real sandbox account and running Phase 5 of veil-foundations' implementation plan
      (first real `terraform plan`/`apply`) unblocks both. See docs/architecture.md's
      "Sequencing to close them" step 5.
    links:
      - "docs/architecture.md#sequencing-to-close-them"

  - id: XREPO-003
    title: "veil-custodian has no signing-key renewal endpoint; veil-enrol has no renew-signing-key subcommand to call it"
    repos: [veil-custodian, veil-enrol]
    status: closed
    raised_date: 2026-08-31
    reviewed_date: 2026-09-06
    closed_date: 2026-09-06
    detail: >
      Closed 2026-09-06: an ADR first (veil-custodian's ADR-T, human-confirmed before any
      code), then built and independently verified on both sides, then proven against each
      other live. veil-custodian: POST /devices/{pseudonym}/signing-keys/{key_ref}/renew,
      gated on EnrolmentAuthority, supersession via nullable superseded_by/superseded_at
      columns (never status=revoked, never a new certificate_status value -- both checked
      directly against consequences on veil-observatory's finding logic and this repo's own
      offboarding cascade), 145 Postgres-backed tests. veil-enrol: renew-signing-key
      subcommand, a new KeyRef newtype for path-injection safety, 100 tests
      (--features dev-header-auth). Designing this surfaced and corrected a real factual
      error in veil-enrol's ADR-VE-004 (repeat issuance with the same keypair does NOT
      409 today, contrary to that ADR's original claim -- it silently succeeds). Live-proven
      end to end in scripts/dev-e2e.sh's new Steps 11-12: a real renewal against a real
      running veil-custodian, with the predecessor's superseded_by confirmed via a live GET
      as veil-observatory, not just asserted by the CLI's own output.
    links:
      - "veil-custodian PR #27 (ADR-T), #28 (implementation)"
      - "veil-enrol PR #6 (implementation)"

  - id: XREPO-004
    title: "veilgremlin's raw r||s (not DER) ECDSA signature-encoding decision needs sign-off from veil-custodian and veil-observatory before any real cross-repo signing happens"
    repos: [veilgremlin, veil-custodian, veil-observatory]
    status: closed
    raised_date: 2026-08-31
    reviewed_date: 2026-09-05
    closed_date: 2026-09-05
    detail: >
      ADR-S names the signing algorithm but takes no position on signature encoding.
      veilgremlin's 2026-08-31 acceptance session decided fixed-width raw r||s (64 bytes) over
      DER, because DER admits multiple valid encodings of one signature and a byte-exact
      golden vector needs exactly one -- but asks for sign-off before treating that as final.
      veil-custodian's own next-actions.md records the ask explicitly, disclosing that "the
      sign-off itself is not this session's to give." veil-observatory's next-actions.md did
      not mention this ask at all as of 2026-09-04 -- confirmed by direct search, not assumed
      absent -- meaning this was, until closed, a one-sided request neither addressee had
      actually seen reflected in their own backlog. Evidence added 2026-09-05: veil-demo's
      ECDSA signing proof (`scripts/ecdsa-signing-proof.sh`) confirmed the raw r||s encoding
      is cryptographically sound and independently verifiable (a from-scratch DER-wrapping
      verifier, including a tampered-signature negative control, confirmed real signatures
      verify and corrupted ones don't), and confirmed live against a real veil-observatory
      instance exactly what happens absent sign-off: an ECDSA-signed record is explicitly and
      safely refused (401), naming this exact gap in its own rejection message. **Closed
      2026-09-05: human sign-off given**, on the strength of that evidence -- raw r||s is
      accepted as veilgremlin's ECDSA wire encoding for cross-repo signing. Downstream work
      this unblocks (veil-observatory building real ECDSA verification, e.g. via KMS Verify
      or a native P-256 library, to replace today's explicit-refusal posture) is not itself
      scheduled by this closure -- that remains separate, unbuilt work, now merely no longer
      blocked on an undecided encoding question.
    links:
      - "veil-demo/docs/ecdsa-signing-proof-transcript.txt"
      - "veil-demo/static/trust-chain.html#the-signing-key-actually-used"

  - id: XREPO-005
    title: "Should ADR-0014's correlation/determinism suite join the same cross-repo CI veto ADR-0012's raw-content fuzz test already has on a veil-proxy schema-generator PR?"
    repos: [veil-observatory, veilgremlin]
    status: closed
    raised_date: 2026-08-23
    reviewed_date: 2026-09-06
    closed_date: 2026-09-06
    detail: >
      Closed 2026-09-06 as mostly an unsynchronized ledger, not a live open question: veilgremlin
      had already reached this conclusion on 2026-08-23 (xhigh-effort Codex critique) and struck
      its own item through, saying explicitly "deferred, not ratified" -- the reasoning was
      settled, human ratification was not, and veil-observatory's own backlog never recorded the
      answer. Ratified on both sides now: NOT `tests/pipeline/test_pipeline.py`'s full suite
      (only 4 of its 14 tests are even ADR-0014-relevant); instead a new, narrow, independently-
      runnable module, veil-observatory's `tests/correlation/test_correlation_contract_gate.py`
      (ADR-0019), asserting against the PRODUCTION `Correlator` -- not `query_time.py`'s
      prototype, which ADR-0016 explicitly bars from production status, a distinction the
      original Codex recommendation's wording did not make. Covers 8 facts, not 7: building
      against the real correlator surfaced `_identity_mismatch()`, a more security-critical
      account/region-mismatch case (a receipt's own signed identity vs. the invocation) than the
      CloudTrail-record case the recommendation named, added rather than traded for it. 10 new
      tests, full suite 610 passed / 2 skipped, 0 regressions.
    links:
      - "veil-observatory/docs/decisions/ADR-0019-correlation-contract-gate.md"
      - "veilgremlin/docs/decisions.md#2026-09-06"

  - id: XREPO-006
    title: "veil-observatory has no consumer for veil-custodian's GET /v1/attestation/status or GET /v1/certificates/crl"
    repos: [veil-observatory, veil-custodian]
    status: closed
    raised_date: 2026-09-06
    reviewed_date: 2026-09-06
    closed_date: 2026-09-06
    detail: >
      Closed 2026-09-06: an ADR first (veil-observatory's ADR-0020, human-confirmed before
      any code), then built and independently verified (648 tests, the three ADR-0011
      fitness tests confirmed unmodified as the design predicted), then given real fixtures
      and HTTP-integration tests on veil-custodian's side (150 tests, including one
      specifically exercising the fixed most-recent-row attestation algorithm rather than
      the superseded one), then proven live against a real veil-custodian in
      veil-demo/scripts/ecdsa-signing-proof.sh's new Steps 11-13. The attestation consumer
      fires a real finding when a device's attestation is revoked or expired while it still
      has an accepted signing-key sighting -- also an independent live check on
      veil-custodian's own tracked, non-atomic revocation-cascade bug. CRL is honestly
      scoped to fetch+cache only, no findings: confirmed by grep that no
      certificate-fingerprint concept exists anywhere in veil-observatory's contracts,
      schemas, or storage, so there is nothing to join a CRL entry against today.
      The live-run proof surfaced a real, separate finding, filed as XREPO-007 below rather
      than silently worked around: veilgremlin hardcodes every real edge event's device_ref
      to null, so the attestation consumer (and any future consumer of the same sighting
      ledger) has nothing to check from ACTUAL production traffic yet -- only from a
      synthetic seed, which the live-run proof used to still verify the consumer's own
      logic is correct.
    links:
      - "docs/architecture.md#integration-status"
      - "veil-observatory PR #21 (ADR-0020), #22 (implementation)"
      - "veil-custodian PR #29 (openapi.yaml fix), #31 (fixtures)"
      - "veil-demo/docs/ecdsa-signing-proof-transcript.txt"

  - id: XREPO-007
    title: "veilgremlin's telemetry sink hardcodes every real edge event's device_ref to null"
    repos: [veilgremlin, veil-observatory]
    status: closed
    raised_date: 2026-09-06
    reviewed_date: 2026-09-08
    closed_date: 2026-09-11
    detail: >
      Closed 2026-09-11: ADR first on both sides (veilgremlin's ADR-016, veil-observatory's
      companion ADR-0021, both human-confirmed before any code, both revised through three
      adversarial review rounds each -- Codex and Fable against the design, Codex again
      against the shipped implementation -- with every finding and correction recorded
      inline rather than smoothed over), then built (veilgremlin: SigningCredential::device_ref()
      derives Envelope::device_ref structurally, dev_<32hex> wire format, schema_version
      bumped to veil.edge_event.v2, interface-contract v1.8; veil-observatory: new v2 schema
      with device_ref tightened to ^dev_[a-f0-9]{32}$, a shared dispatch resolver fixing two
      independently hard-coded schema-id literals), independently verified (veilgremlin:
      full cargo build/test/clippy/fmt/deny/audit clean; veil-observatory: 679 pytest passed,
      validate-all.sh clean), then proven live against real running veil-custodian/veil-enrol/
      veil-observatory instances (veil-demo/scripts/xrepo-007-device-ref-proof.sh): a real
      custodian-issued ECDSA credential produced a real edge-event record declaring
      schema_version=veil.edge_event.v2 and carrying the exact enrolled dev_<32hex> pseudonym
      as device_ref, independently signature-verified (and a tampered signature correctly
      rejected), with veil-observatory retaining the pseudonym verbatim in its signing-key
      sighting ledger. veil-enrol's ADR-VE-005 amended same-day (the "two vocabularies"
      premise it was built on no longer holds now that veilgremlin also emits dev_-prefixed).

      Four limitations closed with, stated explicitly rather than omitted: (1) organic
      traffic without a seamed or (future) keychain-installed credential still emits
      device_ref: null -- no device-side credential installer exists
      (vg-vault::keychain::load_device_signing_credential remains load-only). (2)
      veil-observatory cannot cryptographically verify ECDSA, so these sightings land as
      unverifiable_algorithm, not accepted, and the attestation consumer still cannot key
      off them -- confirmed live in the same proof (HTTP 401, disposition
      unverifiable_algorithm, not a manufactured "accepted"). (3) The certificate loader
      does not verify the CA signature or validity interval
      (vg-vault/src/certificate.rs) -- acceptable because the credential comes from the
      local, already-trusted OS keychain in Phase 1; becomes a hard requirement once Phase 3
      accepts a certificate file. (4) Historical null records are not backfilled.

      Splitting rather than scope-creeping, same precedent XREPO-006's closure set: two new
      items filed below rather than absorbed here -- XREPO-008 (veil-observatory real ECDSA
      verification, the prerequisite for limitation 2) and XREPO-009 (device telemetry
      signing credential lifecycle -- CSR request/cert install/renewal -- the prerequisite
      for limitation 1).
    links:
      - "veil-demo/docs/next-actions.md#session-update-2026-09-06--extended-the-ecdsa-proof-to-close-xrepo-006-and-found-xrepo-007"
      - "veilgremlin PR #70 (ADR-016 + implementation)"
      - "veil-observatory PR #23 (ADR-0021 + implementation)"
      - "veil-enrol PR #9 (ADR-VE-005 amendment)"
      - "veil-demo PR #20 (live-run proof), docs/xrepo-007-device-ref-proof-transcript.txt"

  - id: XREPO-008
    title: "veil-observatory has no real ECDSA verification path -- ECDSA-signed records can never reach disposition accepted"
    repos: [veil-observatory, veilgremlin, veil-custodian]
    status: closed
    raised_date: 2026-09-11
    reviewed_date: 2026-09-11
    closed_date: 2026-09-11
    detail: >
      Closed 2026-09-11: ADR first on veil-observatory's side (ADR-0022), human-confirmed before
      any code (interview-me pass surfaced two real design forks first -- native P-256 library vs
      KMS Verify, decided native since no AWS account exists yet, XREPO-002; live custodian call
      vs a pre-fetched local cache, decided local since custodian.py is fitness-test-locked as
      reachable only from cli.py, ADR-0018). Built: EcdsaReceiptVerifier (raw r||s per XREPO-004,
      DER-converted via cryptography's encode_dss_signature), a new local signing-key material
      cache populated by verify-signing-keys (same custodian call the existing check ledger
      already made, no second network round trip), and an opt-in AlgorithmDispatchVerifier
      (VEIL_ECDSA_VERIFICATION) alongside the existing HmacReceiptVerifier so a deployment that
      hasn't opted in sees zero behaviour change. cryptography added as a runtime dependency,
      amending ADR-0004's zero-dependency stance.

      Two full doubt-driven-development cycles run against the actual shipped implementation
      (not just the ADR) before closure, each with a fresh-context reviewer, the second also
      cross-model-corroborated by Codex -- ten real issues found and fixed across both cycles,
      most severely: performs_cryptographic_verification used OR across the dispatch verifier's
      branches, letting a stub-verified HMAC receipt get durably stamped as cryptographically
      verified whenever ECDSA support was configured alongside it (fixed to AND); and, found by
      Codex alone in cycle 2, the signing key was never bound to a record's own claimed
      device_ref -- device A's genuinely-issued key could sign an event claiming to BE device B,
      and it verified, because custodian's authoritative device_pseudonym was fetched but
      silently dropped when populating the cache (fixed: now required in the cache and
      cross-checked against any claimed device_ref). Every correction recorded inline in
      ADR-0022 with the exact reproduction that found it.

      Live-run proof (veil-demo/scripts/xrepo-008-ecdsa-verification-proof.sh, run twice -- once
      before and once after the cycle-2 fixes) against real running veil-custodian/veil-enrol/
      veilgremlin/veil-observatory: the SAME real ECDSA-signed edge event lands
      401/unverifiable_algorithm before the key-material cache is populated (proves opt-in, no
      default behaviour change -- byte-identical to XREPO-007's own proof), then a FRESH event
      (new nonce) lands 202/accepted after -- the first time in this codebase's history a real,
      organic ECDSA sighting has reached that disposition. Independently re-verified via plain
      openssl outside veil-observatory's own code path (genuine signature verifies, tampered
      signature correctly rejected).

      Limitations closed with, stated explicitly rather than omitted: (1) a signing key's very
      first sighting can never verify -- nothing has cached its material yet until an operator
      runs verify-signing-keys. (2) Cache staleness / revocation lag: a key revoked at custodian
      after the last verify-signing-keys run continues to verify successfully until the next
      check run refreshes the cache -- the same lag ADR-0018 already accepted for the check
      ledger driving revoked_key_finding, now extended to gate accepted too. (3) No KMS Verify
      backend -- stays the documented future path, blocked on XREPO-002 (AWS sandbox account),
      not on anything this closure decided. (4) XREPO-009 (device-side signing-credential
      writer/lifecycle) remains separate and still open -- this closure does not touch it.
    links:
      - "veilgremlin/docs/decisions.md#2026-09-07-adr-016"
      - "veil-observatory PR #24 (ADR-0022 + implementation + two DDD cycles)"
      - "veil-demo PR #21 (live-run proof), docs/xrepo-008-ecdsa-verification-proof-transcript.txt"

  - id: XREPO-009
    title: "No device-side writer exists for a telemetry signing credential -- organic traffic emits device_ref: null until one does"
    repos: [veilgremlin, veil-enrol, veil-custodian]
    status: open
    raised_date: 2026-09-11
    reviewed_date: 2026-09-11
    detail: >
      Filed on XREPO-007's closure (its own plan's Phase 3, the largest piece), not absorbed
      into it. vg-vault::keychain::load_device_signing_credential is load-only by design; the
      only populater ever exercised is the VG_DEVICE_SIGNING_KEY_HEX/VG_DEVICE_SIGNING_CERT_PEM
      env-var test seam, proven repeatedly (XREPO-007's own live-run proof included) but never
      intended as a production install path. CSR-only issuance is already ratified and
      implemented elsewhere in this family (veil-custodian ADR-M/ADR-S: device generates the
      key, custodian never sees or generates it) -- this item is NOT a re-litigation of
      key-transport-vs-CSR; that question is closed. What's missing is the device-side
      surface: veil-enrol's own accepted design already names it (`vg enrol request-csr` /
      `vg enrol install-cert`, to live in veilgremlin's vg-cli per veil-enrol's ADR-VE-002 --
      no device-side binary ships from veil-enrol itself). Hard, unsolved problems named
      explicitly so they aren't discovered mid-implementation: certificate-authenticity/
      trust-anchor distribution (the current loader's "it came from the trusted keychain"
      assumption stops holding once an installer accepts a certificate file --
      vg-vault/src/certificate.rs's own documented limitation, XREPO-007's closure item 3);
      atomic pending/active installation and crash recovery (the keychain code's own
      documented check-then-set non-atomicity); 30-day renewal/expiry lifecycle; mTLS-vs-
      signing credential profile separation (veil-enrol's architecture already requires
      separate keypairs per profile); keychain platform scope (macOS/Windows/Linux all
      enabled in vg-vault's Cargo.toml, not yet decided which are actually supported);
      whether an exportable raw P-256 scalar remains acceptable; the env-var override's
      policy on a managed device (precedence is already defined, the policy isn't); and
      plain-HTTP telemetry transport becoming materially more sensitive once a stable
      pseudonym rides along on every event. Mandatory security-review before merge. Live-run
      proof needs zero seams: request-csr -> veil-enrol -> custodian issues -> install-cert
      -> fresh engine start loads from the real OS keychain with env vars asserted unset.
      Whether that sighting reaches accepted depends on XREPO-008 having landed first --
      it has (closed 2026-09-11), so this prerequisite is now satisfied; XREPO-009's own
      live-run proof, once built, can target accepted rather than unverifiable_algorithm.
    links:
      - "veilgremlin/docs/decisions.md#2026-09-07-adr-016"
      - "veil-enrol/docs/decisions.md ADR-VE-002"
