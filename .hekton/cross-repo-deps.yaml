      certificate-fingerprint concept exists anywhere in veil-observatory's contracts,
      schemas, or storage, so there is nothing to join a CRL entry against today.
      The live-run proof surfaced a real, separate finding, filed as XREPO-007 below rather
      than silently worked around: veilgremlin hardcodes every real edge event's device_ref
      to null, so the attestation consumer (and any future consumer of the same sighting
      ledger) has nothing to check from ACTUAL production traffic yet -- only from a
      synthetic seed, which the live-run proof used to still verify the consumer's own
      logic is correct.
    links:
