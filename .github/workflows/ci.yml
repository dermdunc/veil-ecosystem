name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Bootstrap (generates the gitignored docs/local-assumptions.md verify-project.sh checks for)
        run: bash scripts/bootstrap-project.sh

      - name: Run verify-project.sh
        run: bash scripts/verify-project.sh
